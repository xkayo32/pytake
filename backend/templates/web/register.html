{% extends "base.html" %}

{% block title %}Criar conta{% endblock %}

{% block body %}
<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-md">

    <!-- Logo -->
    <a href="{% url 'web:landing' %}" class="inline-flex items-center gap-2 font-bold text-xl text-slate-900 mb-8">
      <span class="w-9 h-9 rounded-xl bg-primary-600 flex items-center justify-center text-white font-black text-sm shadow">P</span>
      PyTake
    </a>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-1">Criar conta grátis</h1>
      <p class="text-sm text-slate-500 mb-8">14 dias grátis, sem cartão de crédito.</p>

      <form method="post" action="{% url 'web:register' %}" class="space-y-4" x-data="{ loading: false }" @submit="loading = true">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="first_name" class="block text-sm font-medium text-slate-700 mb-1.5">Nome</label>
            <input id="first_name" name="first_name" type="text" required autocomplete="given-name"
              class="block w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
              placeholder="João" />
          </div>
          <div>
            <label for="last_name" class="block text-sm font-medium text-slate-700 mb-1.5">Sobrenome</label>
            <input id="last_name" name="last_name" type="text" required autocomplete="family-name"
              class="block w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
              placeholder="Silva" />
          </div>
        </div>

        <div>
          <label for="company" class="block text-sm font-medium text-slate-700 mb-1.5">Nome da empresa</label>
          <input id="company" name="company" type="text" required
            class="block w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
            placeholder="Acme Ltda" />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email corporativo</label>
          <input id="email" name="email" type="email" required autocomplete="email"
            class="block w-full px-3.5 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
            placeholder="joao@empresa.com" />
        </div>

        <div x-data="{ show: false }">
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Senha</label>
          <div class="relative">
            <input id="password" name="password" :type="show ? 'text' : 'password'" required
              class="block w-full px-3.5 py-2.5 pr-10 rounded-lg border border-slate-200 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
              placeholder="Mínimo 8 caracteres" minlength="8" />
            <button type="button" @click="show = !show" class="absolute inset-y-0 right-3 flex items-center text-slate-400">
              <i class="ph-bold text-lg" :class="show ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <div class="flex items-start gap-3 pt-1">
          <input id="terms" name="terms" type="checkbox" required class="mt-0.5 w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
          <label for="terms" class="text-xs text-slate-500 leading-relaxed">
            Concordo com os <a href="{% url 'web:terms' %}" class="text-primary-600 hover:underline" target="_blank">Termos de Serviço</a>
            e a <a href="{% url 'web:privacy' %}" class="text-primary-600 hover:underline" target="_blank">Política de Privacidade</a>.
          </label>
        </div>

        <button type="submit" :disabled="loading"
          class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-primary-600 hover:bg-primary-700 disabled:opacity-60 text-white font-semibold text-sm transition-colors shadow-sm mt-2">
          <span x-show="!loading">Criar minha conta</span>
          <span x-show="loading" x-cloak class="flex items-center gap-2">
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Criando conta...
          </span>
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">
      Já tem uma conta? <a href="{% url 'web:login' %}" class="font-semibold text-primary-600 hover:text-primary-700">Entrar</a>
    </p>

  </div>
</div>
{% endblock %}
