{% extends "base.html" %}
{% block title %}Acesso negado{% endblock %}
{% block body %}
<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center px-4 text-center">
  <div class="w-20 h-20 rounded-2xl bg-warning-50 flex items-center justify-center mx-auto mb-6">
    <i class="ph-bold ph-lock text-4xl text-warning-500"></i>
  </div>
  <h1 class="text-6xl font-black text-slate-900 mb-3">403</h1>
  <h2 class="text-xl font-bold text-slate-700 mb-2">Acesso negado</h2>
  <p class="text-slate-500 mb-8 max-w-md">Você não tem permissão para acessar esta página. Se acredita que isso é um erro, entre em contato com o administrador.</p>
  <div class="flex flex-col sm:flex-row gap-3">
    <a href="/" class="px-6 py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold text-sm transition-colors">Ir para a home</a>
    <button onclick="history.back()" class="px-6 py-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-colors">Voltar</button>
  </div>
</div>
{% endblock %}
